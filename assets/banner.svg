<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#4f46e5" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <pattern id="gridPattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1" />
    </pattern>

    <!-- Filters -->
    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5" />
    </filter>

    <style>
      .bg-rect { fill: url(#bgGrad); }
      .grid { fill: url(#gridPattern); }
      .title-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        fill: url(#titleGrad);
        letter-spacing: -0.5px;
      }
      .sub-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 21px;
        fill: #94a3b8;
      }
      .badge-text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-weight: 600;
        font-size: 13px;
        fill: #e2e8f0;
      }
      .pill {
        rx: 16px;
        stroke-width: 1px;
      }
      .envelope-glow {
        transform-origin: center;
        animation: pulse 4s ease-in-out infinite alternate;
      }
      @keyframes pulse {
        0% { transform: scale(1); opacity: 0.7; }
        100% { transform: scale(1.12); opacity: 1; }
      }
      @keyframes floatSlow {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-10px) rotate(2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes floatReverse {
        0% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(8px) rotate(-2deg); }
        100% { transform: translateY(0px) rotate(0deg); }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 100; }
        100% { stroke-dashoffset: 0; }
      }
      .floating-1 { animation: floatSlow 6s ease-in-out infinite; }
      .floating-2 { animation: floatReverse 7s ease-in-out infinite; }
      .circuit-line {
        stroke-dasharray: 8 12;
        animation: beamMove 8s linear infinite;
      }
    </style>
  </defs>

  <!-- Deep Background Layer -->
  <rect width="1200" height="400" class="bg-rect" />
  <rect width="1200" height="400" class="grid" />

  <!-- Animated Glowing Orbs (in background) -->
  <circle cx="150" cy="80" r="140" fill="url(#glowGrad1)" filter="url(#blurFilter)" class="envelope-glow" />
  <circle cx="1060" cy="300" r="160" fill="url(#glowGrad2)" filter="url(#blurFilter)" class="envelope-glow" />
  <circle cx="650" cy="360" r="100" fill="url(#glowGrad1)" filter="url(#blurFilter)" />

  <!-- Dynamic Network / Flow Lines in the background -->
  <g opacity="0.35">
    <path class="circuit-line" d="M 50 320 Q 250 260 450 350 T 850 330 T 1150 260" fill="none" stroke="#38bdf8" stroke-width="2" />
    <path class="circuit-line" d="M 80 80 Q 300 140 600 70 T 1120 120" fill="none" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Decorative Feature Badges / Floating Elements (Background/Sides) -->
  <g class="floating-1" opacity="0.85">
    <!-- IMAP / SMTP Card -->
    <g transform="translate(930, 60)" filter="url(#cardGlow)">
      <rect width="190" height="46" rx="23" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="23" r="8" fill="#10b981" />
      <text x="45" y="28" class="badge-text">SMTP • IMAP • JMAP</text>
    </g>
    <!-- Privacy & PGP Card -->
    <g transform="translate(910, 126)" filter="url(#cardGlow)">
      <rect width="215" height="46" rx="23" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="23" r="8" fill="#6366f1" />
      <text x="45" y="28" class="badge-text">SPF • DKIM • DMARC</text>
    </g>
  </g>

  <g class="floating-2" opacity="0.85">
    <!-- Custom Domain Card -->
    <g transform="translate(60, 290)" filter="url(#cardGlow)">
      <rect width="200" height="44" rx="22" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="22" r="7" fill="#38bdf8" />
      <text x="43" y="27" class="badge-text">Custom Domain Mail</text>
    </g>
    <!-- Self-Hosted Docker Card -->
    <g transform="translate(930, 280)" filter="url(#cardGlow)">
      <rect width="195" height="44" rx="22" fill="#1e293b" stroke="#334155" />
      <circle cx="25" cy="22" r="7" fill="#ec4899" />
      <text x="43" y="27" class="badge-text">Docker &amp; Kubernetes</text>
    </g>
  </g>

  <!-- Foreground Main Branding Content -->
  <g transform="translate(100, 85)">
    <!-- Category Pill -->
    <g>
      <rect width="250" height="32" rx="16" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" />
      <circle cx="16" cy="16" r="4.5" fill="#38bdf8" />
      <text x="30" y="21" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" class="title-text">Awesome Business Email Hosting</text>

    <!-- Subtitle & Value Proposition -->
    <text x="0" y="132" class="sub-text">Top Hosted SaaS Solutions &amp; Self-Hosted Open-Source Mail Servers</text>
    <text x="0" y="160" font-family="system-ui, sans-serif" font-size="15" fill="#64748b">
      Enterprise Groupware • Custom Domains • Mailbox Migration • Deliverability &amp; Encryption
    </text>

    <!-- Bottom Feature Pills in Foreground -->
    <g transform="translate(0, 195)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="36" rx="18" fill="rgba(30, 41, 59, 0.75)" stroke="#38bdf8" stroke-width="1.2" />
        <text x="22" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#e0f2fe">☁️ SaaS Providers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="180" height="36" rx="18" fill="rgba(30, 41, 59, 0.75)" stroke="#818cf8" stroke-width="1.2" />
        <text x="20" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#ede9fe">🐧 Self-Hosted OSS</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(375, 0)">
        <rect width="170" height="36" rx="18" fill="rgba(30, 41, 59, 0.75)" stroke="#34d399" stroke-width="1.2" />
        <text x="20" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#d1fae5">🔒 PGP &amp; Security</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(560, 0)">
        <rect width="190" height="36" rx="18" fill="rgba(30, 41, 59, 0.75)" stroke="#f472b6" stroke-width="1.2" />
        <text x="20" y="23" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#fce7f3">📊 Market Analytics</text>
      </g>
    </g>
  </g>

  <!-- Polished Bottom Accent Gradient Bar -->
  <rect x="0" y="394" width="1200" height="6" fill="url(#titleGrad)" />
</svg>
